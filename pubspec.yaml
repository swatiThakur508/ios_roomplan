name: ios_roomplan
description: >-
  A Flutter plugin that brings Apple's RoomPlan API to iOS for single-room
  and multi-room scanning, with floor-plan PDFs, structured scan data, and
  USDZ exports. #Flutter #iOS #RoomPlan #LiDAR
version: 0.2.1
repository: https://github.com/swatiThakur508/ios_roomplan
homepage: https://github.com/swatiThakur508/ios_roomplan
issue_tracker: https://github.com/swatiThakur508/ios_roomplan/issues

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4
  path_provider: ^2.1.5
  pdf: ^3.11.3
  shared_preferences: ^2.5.3
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      ios:
        pluginClass: IosRoomplanPlugin
        sharedDarwinSource: false
